set -g mouse on
set -g mode-keys vi
set -g history-limit 10000
set -g wrap-search off

# Prevent mouse-selection from exiting copy-mode and moving to bottom of screen
unbind -T copy-mode-vi MouseDragEnd1Pane

# Clear the selection when clicking in a pane
bind -T copy-mode-vi MouseDown1Pane {
    select-pane
    send-keys -X clear-selection
}

# Copy the text that is selected by the mouse
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear

# bind -n WheelUpPane if -F "#{pane_in_mode}" "send-keys -M" "copy-mode -e"

