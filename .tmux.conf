set -g default-shell /usr/bin/zsh
set -g mouse on
set -g mode-keys vi
set -g history-limit 10000
set -g wrap-search off

# Set the default terminal inside tmux
set -g default-terminal "tmux-256color"

# Tell tmux that your outside terminal supports True Color (RGB)
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-overrides ",xterm-256color:Tc"

# Force environment to recognize truecolor
set-environment -g COLORTERM "truecolor"

# Prevent mouse-selection from exiting copy-mode and moving to bottom of screen
unbind -T copy-mode-vi MouseDragEnd1Pane

# Clear the selection when clicking in a pane
bind -T copy-mode-vi MouseDown1Pane {
    select-pane
    send-keys -X clear-selection
}

# Copy the text that is selected by the mouse
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear

# bind -n WheelUpPane if -F "#{pane_in_mode}" "send-keys -M" "copy-mode -e"

# Exit copy-mode on any key and return focus to the shell
# bind -T copy-mode Any send -X cancel
# bind -T copy-mode-vi Any send -X cancel

# List of plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'

# Auto install tpm tmux plugin manager on a new machine if not installed
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
